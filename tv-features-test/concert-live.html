<!DOCTYPE html>
<!--
  Concert Live — the Live Stream player (live-stream.html) set up for a live concert: same overlay, controls and
  auto-hide, with concert details and Multi-View; no Key Moment mode.
  The picture is a local video file (Video/Concert.mp4) in a <video> with no controls of its own, so this page's
  seek bar, skips and play/pause drive it. The video loops; the
  stream's position maps onto it modulo its length. It starts muted (browser autoplay rules) and unmutes on the
  first key press or click. The screen stays black until the video starts.
  Needs to be served over http(s) (dev server or GitHub Pages), not opened as a file.
  Same conventions as the other prototypes: 1920x1080 canvas scaled to the window, works with mouse/touch
  and with a TV remote (arrow keys + Enter, Esc/Backspace returns to the Content Picker).
  Player assets are shared with Live Stream (live-stream-assets/, exported from the Figma frame "player live
  tv_Stream", PLAY-player node 1146:37842).
  Controls are desktop-sized by default (see layout()); open with ?mode=tv for the exact Figma TV sizes.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concert Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens from the Figma file (TV Compose) */
  :root{
    --on-surface:#e8e8e8;
    --on-surface-variant:#a8a8a8;
    --inverse-surface:#e8e8e8;
    --surface-container-high:#3a3a3a;
    --surface-container-highest:#4a4a4a;
    --seek-track:#6f6f6f;
    --live:#ea5454;
    --focus:#ffffff;
    --chip-countdown:rgba(56,69,76,0.7);
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:#000;
    color:var(--focus);
    font-family:'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

  #tv-frame{ position:relative; background:#000; overflow:hidden; }
  #canvas{
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
    transform-origin:top left;
    overflow:hidden;
    background:#000;
  }

  /* ---------- Video ---------- */
  /* fills the 1920x1080 canvas; the poster shows until the concert video is added */
  .video{
    position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; pointer-events:none;
  }

  /* the video: fades in once it's actually playing; it never takes the mouse (the overlay does) */
  .video-wrap{ opacity:0; transition:opacity .6s ease; background:#000; overflow:hidden; }
  .video-wrap.ready{ opacity:1; }
  .video-wrap video{ width:100%; height:100%; display:block; object-fit:cover; pointer-events:none; }

  /* ---------- Overlay ---------- */
  .scrim{
    position:absolute; inset:0; opacity:.9; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 24%),
      linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.9) 93%);
  }

  /* ---------- UI size ----------
     --ui shrinks the header and controls relative to the 1920x1080 canvas. It is 1 in TV mode (the Figma sizes);
     in desktop mode layout() sets it so the controls keep a fixed on-screen size, like a web video player.
     Each block is widened by 1/--ui before scaling, so it still spans the full canvas width. */
  #canvas{ --ui:1; }
  .channel, .controls, .mv-panel{ width:calc(1920px / var(--ui)); transform:scale(var(--ui)); }
  .channel{ transform-origin:top left; }
  .controls, .mv-panel{ transform-origin:bottom left; }

  /* ---------- Channel header ---------- */
  .channel{
    position:absolute; left:0; top:0; height:232px;
    display:flex; gap:24px; align-items:flex-start;
    padding:60px 90px;
  }
  /* Back to the Content Picker: a chevron left of the channel logo, vertically centred on it */
  .channel-back{
    width:56px; height:112px; margin-right:8px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--on-surface-variant); border-radius:16px; transition:color .15s ease, background .15s ease;
  }
  .channel-back svg{ width:40px; height:40px; display:block; }
  .channel-back:hover{ color:var(--on-surface); background:rgba(255,255,255,.08); }
  /* remote focus (↑ from the button row): the icon buttons' focused look, a white circle in a ring, dark chevron */
  .channel-back{ position:relative; }
  .channel-back svg{ position:relative; z-index:1; }
  .channel-back::before{
    content:''; position:absolute; left:50%; top:50%; width:69px; height:69px; margin:-34.5px 0 0 -34.5px;
    border-radius:50%; background:#fff; box-shadow:0 0 0 4.5px #121212, 0 0 0 7.5px var(--on-surface);
    opacity:0; transform:scale(.8); transition:opacity .15s ease, transform .15s ease;
  }
  .channel-back.focused{ color:#3B3C3E; background:none; }
  .channel-back.focused::before{ opacity:1; transform:none; }
  .avatar{
    width:112px; height:112px; border-radius:100px; flex:none;
    background:#404045; overflow:hidden;
  }
  /* Cool Channel logo: transparent PNG with dark film reels, so it sits on white, fitted inside the circle */
  .concert-avatar{ background:#fff; padding:10px; }
  .concert-avatar img{ object-fit:contain; border-radius:0; }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:100px; }
  .channel-text{ height:112px; display:flex; flex-direction:column; gap:24px; justify-content:center; }
  .channel-title{ margin:0; font-size:40px; line-height:32px; font-weight:700; white-space:nowrap; }
  .channel-meta{ display:flex; gap:16px; align-items:center; font-size:24px; line-height:1.2; font-weight:500; letter-spacing:-0.24px; white-space:nowrap; }
  .crown{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
  .crown span{ position:relative; width:32px; height:32px; }
  /* Figma: shape inset 16.67% top/bottom, 6.25% left/right inside the 32px icon */
  .crown img{ position:absolute; top:16.67%; bottom:16.67%; left:6.25%; right:6.25%; width:87.5%; height:66.66%; display:block; }
  .countdown{
    height:40px; padding:8px 12px; border-radius:8px;
    background:var(--chip-countdown); backdrop-filter:blur(2px);
    display:flex; align-items:center; line-height:normal;
  }
  .sep{ width:8px; height:8px; display:block; }

  /* ---------- Bottom controls ---------- */
  .controls{
    position:absolute; left:0; bottom:0;
    display:flex; flex-direction:column; gap:32px;
    padding:60px 90px;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; width:100%; }
  .row.buttons{ align-items:flex-end; }
  .group{ display:flex; gap:24px; align-items:center; }
  .row.buttons .group:first-child{ align-items:flex-end; }

  /* Round icon buttons (84px), two states taken from Figma:
     default = #4A4A4A circle at 80% with a light (#E8E8E8, 80%) icon  (e.g. "Start Over")
     focused = 3px #E8E8E8 ring + 69px white circle with a dark (#3B3C3E) icon
     The button SVGs are inlined by JS so these rules can restyle them; the <img> stays as a fallback. */
  .icon-btn{ position:relative; width:84px; height:84px; border-radius:50%; flex:none; }
  .icon-btn > img, .icon-btn > svg{ position:absolute; inset:0; width:84px; height:84px; display:block; overflow:visible; }
  .icon-btn .btn-bg{
    fill:var(--surface-container-highest); opacity:.8;
    transform-box:fill-box; transform-origin:center;
    transition:fill .15s ease, opacity .15s ease, transform .15s ease;
  }
  .icon-btn .btn-glyph{ opacity:.8; transition:opacity .15s ease; }
  .icon-btn .btn-glyph path{ fill:var(--on-surface); transition:fill .15s ease; }
  /* Focus (Figma "Focus Active"): white 69px circle inside a 3px #E8E8E8 ring, dark icon */
  .icon-btn.focused .btn-bg{ fill:#fff; opacity:1; transform:scale(.8214); } /* r 42 -> 34.5 */
  .icon-btn.focused .btn-glyph{ opacity:1; }
  .icon-btn.focused .btn-glyph path{ fill:#3B3C3E; }
  /* line glyphs (the Back chevron) are stroked rather than filled */
  .icon-btn .btn-glyph path.stroke{ fill:none; stroke:var(--on-surface); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; transition:stroke .15s ease; }
  .icon-btn.focused .btn-glyph path.stroke{ fill:none; stroke:#3B3C3E; }
  /* Multi-View's outline icon is drawn at 3px in its Figma export */
  .icon-btn.mv .btn-glyph path.stroke{ stroke-width:3; }
  /* Start Over <-> Watch Live: the same icon mirrored while it would take you back to live */
  .icon-btn .btn-glyph, .icon-btn > img{ transform-box:fill-box; transform-origin:center; transition:opacity .15s ease, transform .25s ease; }
  .icon-btn.flipped .btn-glyph, .icon-btn.flipped > img{ transform:scaleX(-1); }
  .icon-btn::after{
    content:''; position:absolute; inset:-1.5px; border-radius:50%;
    border:3px solid var(--on-surface); opacity:0; transition:opacity .15s ease; pointer-events:none;
  }
  .icon-btn.focused::after{ opacity:1; }

  /* Tooltip above the focused button */
  .tooltip{
    position:absolute; left:50%; top:-82px; transform:translateX(-50%);
    display:none; flex-direction:column; align-items:center; pointer-events:none;
  }
  .icon-btn.focused .tooltip{ display:flex; }
  .tooltip-body{
    background:var(--surface-container-high); border-radius:16px;
    padding:14px 24px; box-shadow:0 2px 8px rgba(0,0,0,.25);
    font-size:24px; line-height:32px; color:var(--on-surface); white-space:nowrap;
  }
  .tooltip-arrow{ width:16.971px; height:16.971px; display:flex; align-items:center; justify-content:center; margin-top:-8.5px; }
  .tooltip-arrow i{ width:12px; height:12px; background:var(--surface-container-high); transform:rotate(-45deg); display:block; }

  /* Seek bar */
  .seek{ display:flex; gap:12px; align-items:center; width:100%; font-size:24px; line-height:28px; color:var(--on-surface-variant); }
  /* the time changes every second, so a fixed width + tabular digits keep the track from jiggling */
  .seek .time-start{ flex:none; width:112px; font-variant-numeric:tabular-nums; }
  /* Live seek bar: one continuous track from programme start (left) to the live edge (right).
     Fully white while watching live; the grey part shows how far behind live you are. */
  .track{ position:relative; flex:1 0 0; height:8px; transition:height .15s ease; cursor:pointer; }
  .bar{ position:absolute; inset:0; border-radius:999px; overflow:hidden; background:var(--seek-track); }
  .played{ position:absolute; left:0; top:0; height:100%; width:100%; border-radius:999px; background:var(--inverse-surface); }
  .badge.live{ transition:opacity .2s ease; }
  .badge.live.behind{ opacity:.45; }
  .handle{ display:none; position:absolute; top:-27px; width:60px; height:60px; margin-left:-27px; }
  /* Figma: handle SVG sits at inset -13.75% / -18.75% / -23.75% / -18.75% of the 60px box */
  .handle img{ position:absolute; top:-8.25px; left:-11.25px; width:82.5px; height:82.5px; display:block; }
  .seek.focused .track{ height:12px; }
  .seek.focused .handle{ display:block; }
  .handle svg{ position:absolute; top:-8.25px; left:-11.25px; width:82.5px; height:82.5px; display:block; overflow:visible; cursor:pointer; }
  /* handle glyph: pause while playing, play while paused, and while scrubbing:
     .skip = 10s jump (circular arrow), .fast = hold for 2x (double triangle); .rev mirrors both for rewind */
  .handle .glyph-play, .handle .glyph-skip, .handle .glyph-fast{ display:none; }
  .handle.paused .glyph-play{ display:inline; }
  .handle.paused .glyph-pause{ display:none; }
  .handle.skip .glyph-skip, .handle.fast .glyph-fast{ display:inline; }
  .handle.skip .glyph-pause, .handle.skip .glyph-play,
  .handle.fast .glyph-pause, .handle.fast .glyph-play{ display:none; }

  /* Scrub preview above the handle: thumbnail, time and a pointer (shown while skipping / fast-scrubbing).
     .preview sits on the handle's x; the thumbnail is shifted by JS so it stays inside the track. */
  .preview{
    position:absolute; bottom:47px; width:0; height:0;
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  /* appears instantly on a key press, fades out after */
  .seek.scrubbing .preview{ opacity:1; transition:none; }
  /* the icon buttons step aside while scrubbing so the preview sits over clear picture */
  .controls:has(.seek.scrubbing) .row.buttons{ opacity:0; }
  .preview-arrow{
    position:absolute; bottom:0; left:-9px; width:0; height:0;
    border-left:9px solid transparent; border-right:9px solid transparent; border-top:11px solid var(--on-surface-variant);
  }
  .preview-time{
    position:absolute; bottom:18px; left:0; transform:translateX(-50%);
    font-size:24px; line-height:28px; color:var(--on-surface-variant); white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .preview-thumb{
    position:absolute; bottom:58px; width:320px; height:180px; border-radius:12px; overflow:hidden;
    background:var(--surface-container-high); box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .preview-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* Text chips */
  .chip{
    height:60px; padding:0 40px; border-radius:1000px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; line-height:32px; font-weight:500; color:var(--on-surface-variant);
    opacity:.8; white-space:nowrap; transition:background .15s ease, color .15s ease;
  }
  .chip.focused{ opacity:1; background:var(--inverse-surface); color:#1b1b1b; }

  /* Badges */
  .badge{
    display:flex; gap:8px; align-items:center; justify-content:center;
    padding:12px 24px; border-radius:1000px;
    font-size:24px; font-weight:500; line-height:normal; color:var(--focus); white-space:nowrap;
  }
  .badge.viewers{ background:var(--surface-container-highest); }
  .badge.viewers img{ width:24px; height:24px; display:block; }
  .badge.live{ background:var(--live); }
  .badge.live .dot{ width:12px; height:12px; border-radius:100px; background:var(--focus); }

  @keyframes slideUp{ from{ transform:translateY(100%); opacity:0; } to{ transform:none; opacity:1; } }

  /* ---------- Multi-View ----------
     Figma "PLAY-player" node 1217:6576. The Multi-View button opens a panel in place of the controls: Back and
     Multi-View buttons, a divider, the "Screen Choice" pill (1, 2, 3, 4, 5, 6 and 1 large + 5 screens) and "Customize your screen" with one
     16:9 card per camera angle. Picking a layout splits the picture right away. Picking cards sets their priority:
     the number on a card is its screen (1 = main). Every screen plays at once, as cameras on the same concert: each is
     its own video player kept in step with the stream clock at its camera's offset. Only screen 1 has sound. */
  .mv-screens{ position:absolute; inset:0; pointer-events:none; }
  .mv-screen{ position:absolute; overflow:hidden; background:#000; display:none; }
  .mv-screen img{ width:100%; height:100%; object-fit:cover; display:block; }
  /* the screen's own player: covers the still once it's playing */
  .mv-video{ position:absolute; inset:0; overflow:hidden; opacity:0; transition:opacity .6s ease; }
  .mv-video.ready{ opacity:1; }
  /* fills its screen; screens that aren't 16:9 crop the picture */
  .mv-video video{ width:100%; height:100%; display:block; object-fit:cover; pointer-events:none; }
  .mv-screen.empty .mv-video{ display:none; }
  .mv-panel{ position:absolute; left:0; bottom:0; display:none; flex-direction:column; gap:32px; padding:60px 90px; }
  #canvas.mv-open .mv-panel{ display:flex; animation:slideUp .35s ease-out; }
  #canvas.mv-open .controls{ display:none; }
  .mv-top{ display:flex; gap:40px; align-items:flex-end; }
  .mv-btns{ display:flex; gap:24px; align-items:center; }
  .mv-divider{ width:3px; height:87px; margin:-1.5px 0; display:block; flex:none; }
  .mv-choice{ height:84px; padding:0 7.5px; border-radius:100px; background:#4a4a4a; display:flex; gap:24px; align-items:center; }
  .mv-opt{ position:relative; width:69px; height:69px; border-radius:100px; flex:none; transition:background .15s ease; }
  .mv-opt > img, .mv-opt > svg{
    position:absolute; left:calc(50% + .5px); top:calc(50% + .5px); width:38px; height:46px;
    transform:translate(-50%,-50%); display:block; overflow:visible;
  }
  .mv-opt path{ transition:stroke .15s ease; }
  /* chosen layout: Figma's on-surface-disabled fill; focused (not in Figma): white with a dark icon, like the buttons */
  .mv-opt.selected{ background:rgba(232,232,232,.4); }
  .mv-opt.focused{ background:#fff; }
  .mv-opt.focused path{ stroke:#3B3C3E; }
  /* tooltip naming the layout ("2 Screens"), same style as the icon buttons'; raised so it lines up with theirs */
  .mv-opt .tooltip{ top:-89.5px; }
  .mv-opt.focused .tooltip{ display:flex; }
  .mv-section{ display:flex; flex-direction:column; gap:24px; }
  .mv-label{ font-size:24px; line-height:32px; font-weight:500; color:var(--inverse-surface); white-space:nowrap; }
  .mv-cards{ display:flex; gap:24px; transition:transform .3s ease; }
  .mv-card{ position:relative; flex:none; width:320px; height:180px; border-radius:16px; background:var(--surface-container-high); }
  .mv-card img{ width:100%; height:100%; object-fit:cover; border-radius:16px; display:block; }
  /* focus ring (not in the Figma frame) */
  .mv-card::after{
    content:''; position:absolute; inset:-6px; border-radius:22px;
    border:4px solid var(--on-surface); opacity:0; transition:opacity .15s ease; pointer-events:none;
  }
  .mv-card.focused::after{ opacity:1; }
  /* priority number = the screen the video is on (1 plays); cards without a number aren't on screen */
  .mv-card img{ transition:opacity .15s ease; }
  .mv-card:not(.picked) img{ opacity:.45; }
  .mv-badge{
    position:absolute; left:12px; top:12px; width:44px; height:44px; border-radius:50%; display:none;
    align-items:center; justify-content:center; font-size:24px; font-weight:700; line-height:1;
    background:#fff; color:#1b1b1b; box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .mv-card.picked .mv-badge{ display:flex; }
  /* a screen with no video picked for it yet */
  .mv-screen.empty{ background:#141414; display:flex; align-items:center; justify-content:center; }
  .mv-screen.empty img{ display:none; }
  .mv-screen span{ display:none; font-size:24px; line-height:32px; font-weight:500; color:var(--on-surface-variant); }
  .mv-screen.empty span{ display:block; }
  /* the Multi-View button shows "Active" while the panel is open or the screen is split */
  #canvas.mv-active .icon-btn.mv:not(.focused) .btn-bg{ fill:var(--on-surface); opacity:1; }
  #canvas.mv-active .icon-btn.mv .btn-glyph{ opacity:1; }
  #canvas.mv-active .icon-btn.mv .btn-glyph path.stroke{ stroke:#3B3C3E; }

  /* ---------- Auto-hide ("wake") ----------
     After 3s without input the header fades up and the controls fade down; the LIVE tag stays.
     `translate` is used (not `transform`) so it stacks with the --ui scale on .channel/.controls. */
  .scrim, .channel, .row.buttons, .seek, .row.chips > .group:first-child, .mv-panel, .badge.viewers{
    transition:opacity .45s ease, translate .45s ease;
  }
  #canvas.ui-hidden .scrim{ opacity:0; }
  #canvas.ui-hidden .channel{ opacity:0; translate:0 -40px; pointer-events:none; }
  #canvas.ui-hidden .row.buttons,
  #canvas.ui-hidden .seek,
  #canvas.ui-hidden .row.chips > .group:first-child,
  #canvas.ui-hidden .mv-panel,
  #canvas.ui-hidden .badge.viewers{ opacity:0; translate:0 40px; pointer-events:none; }

  /* Toast */
  .toast{
    position:absolute; left:50%; top:96px; transform:translate(-50%,-20px);
    background:var(--surface-container-high); color:var(--on-surface);
    padding:16px 28px; border-radius:16px; font-size:24px; line-height:32px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    opacity:0; transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div id="tv-frame">
  <div id="canvas">
    <!-- Concert video: put the file in concert-assets/ and add it as the src, e.g. src="concert-assets/concert.mp4" -->
    <!-- the stream's picture: a local video file, looping, muted until the first key press or click -->
    <div class="video video-wrap" id="videoWrap"><video src="Video/Concert.mp4" muted loop playsinline preload="auto"></video></div>
    <!-- Multi-View: screens 2-6 of a split layout, each with its own muted player (screen 1 is the video above) -->
    <div class="mv-screens" id="mvScreens"></div>
    <div class="scrim ui" id="scrim"></div>
    <div class="ui" id="ui">
      <header class="channel">
        <button class="channel-back" id="channelBack" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="avatar concert-avatar"><img src="concert-assets/channel-cool.png" alt="Cool Channel"></div>
        <div class="channel-text">
          <h1 class="channel-title">TOMORROW X TOGETHER — Love Language</h1>
          <div class="channel-meta">
            <span>Cool Channel</span>
            <span class="crown"><span><img src="live-stream-assets/crown.svg" alt="Premium"></span></span>
            <span class="countdown" aria-label="Channel number">701</span>
            <img class="sep" src="live-stream-assets/dot-separator.svg" alt="">
            <span>21:00 - 23:30</span>
          </div>
        </div>
      </header>

      <section class="controls">
        <div class="row buttons">
          <div class="group">
            <button class="icon-btn" data-row="0" data-action="startOver" data-label="Start Over" aria-label="Start over">
              <img src="live-stream-assets/btn-start-over.svg" alt="">
            </button>
            <button class="icon-btn mv" data-row="0" data-action="multiView" data-label="Multi-View" aria-label="Multi-view">
              <img src="concert-assets/btn-multiview.svg" alt="">
            </button>
          </div>
          <div class="group">
            <button class="icon-btn" data-row="0" data-action="favorite" data-label="Add to Favorites" aria-label="Add to favorites">
              <img src="live-stream-assets/btn-fav.svg" alt="">
            </button>
            <button class="icon-btn" data-row="0" data-action="subAudio" data-label="Subtitles &amp; Audio" aria-label="Subtitles and audio">
              <img src="live-stream-assets/btn-sub-audio.svg" alt="">
            </button>
            <button class="icon-btn" data-row="0" data-action="settings" data-label="Settings" aria-label="Settings">
              <img src="live-stream-assets/btn-settings.svg" alt="">
            </button>
          </div>
        </div>

        <div class="seek" data-row="1" id="seek">
          <span class="time-start" id="timeStart">00:00</span>
          <div class="track" id="track">
            <!-- the bar itself (track colour, played part) -->
            <div class="bar" id="bar">
              <div class="played" id="played"></div>
            </div>
            <div class="handle" id="handle"><img src="live-stream-assets/seek-handle.svg" alt=""></div>
            <div class="preview" id="preview" aria-hidden="true">
              <div class="preview-thumb" id="previewThumb"><img src="concert-assets/moment-010.jpg" alt=""></div>
              <div class="preview-time" id="previewTime">00:00</div>
              <i class="preview-arrow"></i>
            </div>
          </div>
        </div>

        <div class="row chips">
          <div class="group">
            <button class="chip" data-row="2" data-action="browse">Browse Channels</button>
            <button class="chip" data-row="2" data-action="guide">Open Program Guide</button>
          </div>
          <div class="group">
            <div class="badge viewers"><img src="live-stream-assets/icon-viewers.svg" alt="Viewers"><span>99.9 K</span></div>
            <div class="badge live"><span class="dot"></span><span>LIVE</span></div>
          </div>
        </div>
      </section>

      <!-- Multi-View panel, shown in place of the controls (see openMulti) -->
      <section class="mv-panel" id="mvPanel" aria-label="Multi-View">
        <div class="mv-top">
          <div class="mv-btns">
            <button class="icon-btn" data-mv="close" data-label="Back" aria-label="Back"><img src="concert-assets/mv-back.svg" alt=""></button>
            <button class="icon-btn mv" data-mv="close" data-label="Multi-View" aria-label="Close multi-view"><img src="concert-assets/btn-multiview.svg" alt=""></button>
          </div>
          <img class="mv-divider" src="concert-assets/mv-divider.svg" alt="">
          <div class="mv-choice" aria-label="Screen layout">
          <button class="mv-opt" data-mv="layout" data-layout="1" data-label="1 Screen" aria-label="1 Screen"><img src="concert-assets/mv-screen-1.svg" alt=""></button>
          <button class="mv-opt" data-mv="layout" data-layout="2" data-label="2 Screens" aria-label="2 Screens"><img src="concert-assets/mv-screen-2.svg" alt=""></button>
          <button class="mv-opt" data-mv="layout" data-layout="3" data-label="3 Screens" aria-label="3 Screens"><img src="concert-assets/mv-screen-3.svg" alt=""></button>
          <button class="mv-opt" data-mv="layout" data-layout="4" data-label="4 Screens" aria-label="4 Screens"><img src="concert-assets/mv-screen-4.svg" alt=""></button>
          <button class="mv-opt" data-mv="layout" data-layout="5" data-label="5 Screens" aria-label="5 Screens"><img src="concert-assets/mv-screen-5.svg" alt=""></button>
          <button class="mv-opt" data-mv="layout" data-layout="6" data-label="6 Screens" aria-label="6 Screens"><img src="concert-assets/mv-screen-6.svg" alt=""></button>
          <button class="mv-opt" data-mv="layout" data-layout="6f" data-label="1 Large + 5 Screens" aria-label="1 Large + 5 Screens"><img src="concert-assets/mv-screen-6-featured.svg" alt=""></button>
          </div>
        </div>
        <div class="mv-section">
          <div class="mv-label">Customize your screen</div>
          <div class="mv-cards" id="mvCards"></div>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function(){
  /* ---------------- icon buttons: inline the SVGs so CSS can switch default/active ---------------- */
  // Every button SVG is an 84px circle ("Background") followed by the icon group; the ring and the smaller circle
  // of the focused look come from the .focused CSS.
  document.querySelectorAll('.icon-btn > img').forEach(function(img){
    fetch(img.getAttribute('src')).then(function(r){ return r.ok ? r.text() : Promise.reject(); }).then(function(text){
      var svg = new DOMParser().parseFromString(text, 'image/svg+xml').documentElement;
      var bg = svg.querySelector('[id="Background"]');
      if(!bg || !bg.nextElementSibling) return;
      svg.setAttribute('width', '84'); svg.setAttribute('height', '84');
      svg.removeAttribute('style');
      bg.setAttribute('class', 'btn-bg');
      bg.nextElementSibling.setAttribute('class', 'btn-glyph');
      svg.setAttribute('aria-hidden', 'true');
      img.replaceWith(document.importNode(svg, true));
    }).catch(function(){ /* keep the <img> */ });
  });

  /* ---------------- tooltips ---------------- */
  document.querySelectorAll('.icon-btn, .mv-opt').forEach(function(btn){
    var tip = document.createElement('span');
    tip.className = 'tooltip';
    tip.innerHTML = '<span class="tooltip-body"></span><span class="tooltip-arrow"><i></i></span>';
    tip.firstChild.textContent = btn.getAttribute('data-label');
    btn.appendChild(tip);
  });

  /* ---------------- focus model ---------------- */
  // Row 0: icon buttons, row 1: seek bar, row 2: text chips. Starts on the seek bar.
  var allRow0 = Array.prototype.slice.call(document.querySelectorAll('[data-row="0"]'));
  var allRow2 = Array.prototype.slice.call(document.querySelectorAll('[data-row="2"]'));
  var rows = [
    allRow0,
    [document.getElementById('seek')],
    allRow2
  ];
  // the first time ↑ is pressed it lands on Start Over (col 0); after that each row remembers its last focus
  var colByRow = [0, 0, 0];

  /* ---------------- live playback clock ---------------- */
  // The bar spans the start of the live stream (left) to the live edge (right). live = seconds the stream has been
  // running since the page opened; it always ticks. pos = seconds into the stream of the picture on screen; it ticks
  // while playing and can't pass live. At the live edge the bar is full; pausing or skipping back leaves a grey gap.
  // Left label = elapsed time of the picture on screen, starting at 00:00.
  // FAST_SPEED = seconds of video moved per second the key is held (fast rewind / forward)
  var SKIP_SECONDS = 10, FAST_SPEED = 10, HOLD_MS = 400, SCRUB_LINGER_MS = 1000;
  // the concert stream opens one video length in (VIDEO_LEN, the video's length in seconds), so there's room to rewind
  var VIDEO_LEN = 199;
  var state = { row:1, col:0, live:VIDEO_LEN, pos:VIDEO_LEN, playing:true };

  function pad(n){ return (n<10 ? '0' : '') + n; }
  function elapsed(s){
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(sec);
  }

  var timeStart = document.getElementById('timeStart');
  var handleEl = document.getElementById('handle');
  var liveBadge = document.querySelector('.badge.live');
  var startOverBtn = document.querySelector('[data-action="startOver"]');
  state.startedOver = false;

  function setLabel(btn, label){
    if(btn.getAttribute('data-label') === label) return;
    btn.setAttribute('data-label', label);
    btn.setAttribute('aria-label', label);
    var body = btn.querySelector('.tooltip-body');
    if(body) body.textContent = label;
  }

  function render(){
    rows.forEach(function(items, r){
      items.forEach(function(el, c){ el.classList.toggle('focused', r===state.row && c===state.col); });
    });
    var frac = state.live ? Math.min(1, state.pos/state.live) : 1, pct = (frac*100) + '%';
    document.getElementById('played').style.width = pct;
    handleEl.style.left = pct;
    handleEl.classList.toggle('paused', !state.playing);
    handleEl.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
    timeStart.textContent = elapsed(Math.floor(state.pos));
    renderScrub(frac);
    syncVideo();
    liveBadge.classList.toggle('behind', state.pos < state.live);
    // Start Over switches to Watch Live after it's used, and back once playback is at the live edge again
    if(state.startedOver && state.pos >= state.live) state.startedOver = false;
    setLabel(startOverBtn, state.startedOver ? 'Watch Live' : 'Start Over');
    startOverBtn.classList.toggle('flipped', state.startedOver);
  }

  function seekTo(pos){ cancelSkipAnim(); state.pos = Math.max(0, Math.min(state.live, Math.round(pos))); }
  // any other seek takes over from a running 10s glide
  function cancelSkipAnim(){ if(skipAnim){ cancelAnimationFrame(skipAnim.raf); clearTimeout(skipAnim.fallback); skipAnim = null; } }
  function togglePlay(){ state.playing = !state.playing; render(); }
  setInterval(function(){
    state.live++;
    // normal playback pauses while fast-scrubbing; the scrub timer moves the playhead instead
    if(state.playing && scrub.mode !== 'fast'){
      state.pos = Math.min(state.live, state.pos + 1);
      if(skipAnim){ skipAnim.from += 1; skipAnim.to = Math.min(state.live, skipAnim.to + 1); }
    }
    render();
  }, 1000);

  /* ---------------- rewind / forward on the seek bar ---------------- */
  // Tap <- / -> : jump 10s (handle shows the circular-arrow glyph).
  // Hold <- / -> : fast rewind / forward at 2x until released (handle shows the double-triangle glyph).
  // Both show the thumbnail + time preview; rewind mirrors the glyph. The glyph and preview linger 1s after.
  var scrub = { mode:null, dir:1 }, fastTimer = null, lingerTimer = null, press = null;
  var seekEl = document.getElementById('seek'), trackEl = document.getElementById('track');
  var previewEl = document.getElementById('preview'), previewThumb = document.getElementById('previewThumb');
  var previewTime = document.getElementById('previewTime');
  var THUMB_W = 320;

  // frames captured from the video (seconds into it), for the scrub preview's thumbnail
  var FRAMES = [10, 30, 80, 120, 150, 190].map(function(t){
    return { t:t, img:'concert-assets/moment-' + ('00' + t).slice(-3) + '.jpg' };
  });
  // only touch an <img> when its picture actually changes (render runs every frame while scrubbing)
  function setSrc(img, src){ if(img && img.getAttribute('src') !== src) img.setAttribute('src', src); }

  function renderScrub(frac){
    handleEl.classList.toggle('skip', scrub.mode === 'skip');
    handleEl.classList.toggle('fast', scrub.mode === 'fast');
    var dirGroup = handleEl.querySelector('.glyph-dir');
    if(dirGroup) dirGroup.setAttribute('transform', scrub.dir < 0 ? 'translate(82.5 0) scale(-1 1)' : '');
    seekEl.classList.toggle('scrubbing', !!scrub.mode);
    if(!scrub.mode) return;
    // preview follows the handle; the thumbnail is clamped so it never leaves the track
    var trackW = trackEl.offsetWidth, x = frac * trackW;
    previewEl.style.left = x + 'px';
    var thumbLeft = Math.max(0, Math.min(trackW - THUMB_W, x - THUMB_W/2));
    previewThumb.style.left = (thumbLeft - x) + 'px';
    previewTime.textContent = elapsed(Math.floor(state.pos));
    // thumbnail: the captured frame nearest to that point in the video
    var vt = state.pos % VIDEO_LEN, best = FRAMES[0];
    FRAMES.forEach(function(f){ if(Math.abs(f.t - vt) < Math.abs(best.t - vt)) best = f; });
    setSrc(previewThumb.querySelector('img'), best.img);
  }

  function showScrub(mode, dir){
    clearTimeout(lingerTimer);
    scrub.mode = mode; scrub.dir = dir;
  }
  function endScrubSoon(){
    clearTimeout(lingerTimer);
    lingerTimer = setTimeout(function(){ scrub.mode = null; render(); }, SCRUB_LINGER_MS);
  }

  // A 10s tap glides the playhead to its target over SKIP_ANIM_MS (ease-out) instead of jumping.
  // Taps during a glide stack onto its target; the 1s playback tick shifts the glide along with it.
  var SKIP_ANIM_MS = 350, skipAnim = null;
  function skip(dir){
    showScrub('skip', dir);
    var base = skipAnim ? skipAnim.to : state.pos;
    var to = Math.max(0, Math.min(state.live, Math.round(base + dir*SKIP_SECONDS)));
    cancelSkipAnim();
    skipAnim = { from:state.pos, to:to, t0:performance.now() };
    function finish(){ var a = skipAnim; cancelSkipAnim(); state.pos = a.to; render(); }
    function step(now){
      var t = Math.min(1, (now - skipAnim.t0) / SKIP_ANIM_MS);
      var ease = 1 - Math.pow(1 - t, 3);
      state.pos = skipAnim.from + (skipAnim.to - skipAnim.from) * ease;
      render();
      if(t < 1) skipAnim.raf = requestAnimationFrame(step);
      else finish();
    }
    skipAnim.raf = requestAnimationFrame(step);
    // if no frames are drawn (e.g. background tab), still land on the target
    skipAnim.fallback = setTimeout(finish, SKIP_ANIM_MS + 100);
    endScrubSoon();
  }
  function startFast(dir){
    cancelSkipAnim();
    showScrub('fast', dir);
    cancelAnimationFrame(fastTimer);
    // advance every animation frame by the real time elapsed, so the handle glides at FAST_SPEED
    var last = performance.now();
    function step(now){
      var dt = Math.min(0.25, (now - last) / 1000);  // cap so a stalled frame (e.g. tab in background) doesn't jump
      last = now;
      state.pos = Math.max(0, Math.min(state.live, state.pos + dir*FAST_SPEED*dt));
      render();
      fastTimer = requestAnimationFrame(step);
    }
    fastTimer = requestAnimationFrame(step);
    render();
  }
  function stopFast(){
    cancelAnimationFrame(fastTimer); fastTimer = null;
    state.pos = Math.floor(state.pos);
    render();
    endScrubSoon();
  }

  // Key handling for <- / -> while the seek bar is focused: decide tap vs hold on release / after HOLD_MS
  function seekKeyDown(dir){
    if(press) return;
    press = { dir:dir, fast:false };
    press.timer = setTimeout(function(){
      press.fast = true;
      startFast(dir);
    }, HOLD_MS);
  }
  function seekKeyUp(){
    if(!press) return;
    clearTimeout(press.timer);
    if(press.fast) stopFast();
    else skip(press.dir);
    press = null;
  }
  window.addEventListener('keyup', function(e){
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') seekKeyUp();
  });
  window.addEventListener('blur', seekKeyUp);

  function move(dRow, dCol){
    if(dRow){
      var r = Math.max(0, Math.min(rows.length-1, state.row + dRow));
      if(r === state.row) return;
      colByRow[state.row] = state.col;
      state.row = r;
      state.col = Math.min(colByRow[r], rows[r].length-1);
    } else if(state.row === 1){
      // on the seek bar, left/right jump 10s (keyboard taps/holds go through seekKeyDown instead)
      skip(dCol);
      return;
    } else {
      state.col = Math.max(0, Math.min(rows[state.row].length-1, state.col + dCol));
    }
    render();
  }

  /* ---------------- seek handle: inline so its glyph can change ---------------- */
  // The Figma handle shows the pause glyph (shown while playing). Added glyphs, all centred in the same 24px circle
  // (cx 41.25, cy 38.25): play triangle (paused), the Start Over arrow mirrored to point clockwise (10s skip), and
  // a double outlined triangle (2x fast). Skip/fast sit in .glyph-dir, which renderScrub() mirrors for rewind.
  var handleImg = handleEl.querySelector('img');
  function getText(url){ return fetch(url).then(function(r){ return r.ok ? r.text() : Promise.reject(); }); }
  Promise.all([getText(handleImg.getAttribute('src')), getText('live-stream-assets/btn-start-over.svg')]).then(function(texts){
    var parse = function(t){ return new DOMParser().parseFromString(t, 'image/svg+xml').documentElement; };
    var svg = parse(texts[0]);
    var pause = svg.querySelector('[id="Icon"] path');
    var arrow = parse(texts[1]).querySelector('[id="shape"]');
    if(!pause || !arrow) return;
    var NS = 'http://www.w3.org/2000/svg', ink = '#3B3C3E';
    pause.setAttribute('class', 'glyph-pause');

    var play = document.createElementNS(NS, 'path');
    play.setAttribute('class', 'glyph-play');
    play.setAttribute('d', 'M36.5 28.25 L51.5 38.25 L36.5 48.25 Z');
    play.setAttribute('fill', ink); play.setAttribute('stroke', ink);
    play.setAttribute('stroke-width', '2.5'); play.setAttribute('stroke-linejoin', 'round');

    var dir = document.createElementNS(NS, 'g');
    dir.setAttribute('class', 'glyph-dir');
    // Start Over's arrow (x 21-59.5, y 24.5-59.5 in an 84 box) scaled to ~22px and mirrored so it turns clockwise
    var skipGlyph = document.createElementNS(NS, 'path');
    skipGlyph.setAttribute('class', 'glyph-skip');
    skipGlyph.setAttribute('d', arrow.getAttribute('d'));
    skipGlyph.setAttribute('fill', ink);
    skipGlyph.setAttribute('transform', 'translate(41.25 38.25) scale(-0.6 0.6) translate(-40.25 -42)');
    var fastGlyph = document.createElementNS(NS, 'path');
    fastGlyph.setAttribute('class', 'glyph-fast');
    fastGlyph.setAttribute('d', 'M29.75 30.25 L40.25 38.25 L29.75 46.25 Z M41.25 30.25 L51.75 38.25 L41.25 46.25 Z');
    fastGlyph.setAttribute('fill', 'none'); fastGlyph.setAttribute('stroke', ink);
    fastGlyph.setAttribute('stroke-width', '2.25'); fastGlyph.setAttribute('stroke-linejoin', 'round');
    dir.appendChild(skipGlyph); dir.appendChild(fastGlyph);

    pause.parentNode.appendChild(play);
    pause.parentNode.appendChild(dir);
    svg.removeAttribute('style');
    svg.setAttribute('aria-hidden', 'true');
    handleImg.replaceWith(document.importNode(svg, true));
    render();
  }).catch(function(){ /* keep the <img> */ });

  /* ---------------- actions ---------------- */
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  var favorite = false;
  function activate(){
    var el = rows[state.row][state.col];
    var action = el.getAttribute('data-action');
    if(state.row === 1){ togglePlay(); return; }
    if(action === 'favorite'){ favorite = !favorite; toast(favorite ? 'Added to Favorites' : 'Removed from Favorites'); return; }
    if(action === 'startOver'){
      if(state.startedOver){ seekTo(state.live); state.startedOver = false; }   // Watch Live: back to the live edge
      else { seekTo(0); state.startedOver = state.live > 0; }                  // Start Over: back to 00:00
      state.playing = true;
      render();
      return;
    }
    if(action === 'multiView'){ openMulti(); return; }
    toast(el.getAttribute('data-label') || el.textContent + ' (demo)');
  }

  // Back to the Content Picker: return via history when we came from it, otherwise open it
  var channelBack = document.getElementById('channelBack');
  channelBack.addEventListener('click', function(e){ e.stopPropagation(); goBackToPicker(); });

  // Remote: ↑ from the top row of buttons focuses Back (in the header); Enter goes back, ↓ returns to the buttons.
  // Handled before the main key handler (capture), so the rest of the focus model stays as it is.
  var backFocus = false;
  var renderBase = render;
  render = function(){
    renderBase();
    channelBack.classList.toggle('focused', backFocus);
    if(backFocus) document.querySelectorAll('.controls .focused').forEach(function(el){ el.classList.remove('focused'); });
  };
  window.addEventListener('keydown', function(e){
    if(backFocus){
      if(e.key === 'Escape' || e.key === 'Backspace'){ backFocus = false; render(); return; }   // main handler takes it from here
      e.preventDefault(); e.stopImmediatePropagation();
      wake();
      if(e.key === 'Enter' || e.key === ' '){ if(!e.repeat) goBackToPicker(); }
      else if(e.key === 'ArrowDown'){ backFocus = false; render(); }
      return;
    }
    if(e.key === 'ArrowUp' && state.row === 0 && !isHidden() && !mv.open){
      e.preventDefault(); e.stopImmediatePropagation();
      wake();
      backFocus = true;
      render();
    }
  }, true);
  function goBackToPicker(){
    try {
      if(document.referrer && /content-picker\.html/.test(document.referrer) && history.length > 1){ history.back(); return; }
    } catch(e){}
    window.location.href = 'content-picker.html';
  }

  /* ---------------- video ---------------- */
  // The page's own clock (state.pos / state.playing) stays in charge; syncVideo() makes the video player follow
  // it: play/pause, and a seek whenever the picture is more than SYNC_SLACK seconds off (seeks, skips, or drift
  // from buffering).
  // A <video> wrapped in the play/pause/seek/time/length/mute calls the sync logic below uses
  var PlayerState = { PLAYING:1, PAUSED:2, BUFFERING:3 };
  function FilePlayer(video){
    this.v = video;
  }
  FilePlayer.prototype = {
    getPlayerState: function(){
      var v = this.v;
      if(v.paused || v.ended) return PlayerState.PAUSED;
      return v.seeking || v.readyState < 3 ? PlayerState.BUFFERING : PlayerState.PLAYING;
    },
    getCurrentTime: function(){ return this.v.currentTime; },
    getDuration: function(){ return isFinite(this.v.duration) ? this.v.duration : 0; },
    seekTo: function(t){ this.v.currentTime = t; },
    playVideo: function(){ var r = this.v.play(); if(r && r.catch) r.catch(function(){}); },
    pauseVideo: function(){ this.v.pause(); },
    mute: function(){ this.v.muted = true; },
    unMute: function(){ this.v.muted = false; },
    isMuted: function(){ return this.v.muted; }
  };
  // make a player for `wrap`'s <video>; onReady runs once its length is known, the wrap fades in once it plays
  function makePlayer(wrap, onReady){
    var video = wrap.querySelector('video'), player = new FilePlayer(video), done = false;
    function ready(){ if(!done){ done = true; onReady(player); } }
    video.addEventListener('loadedmetadata', ready);
    if(video.readyState >= 1) ready();
    video.addEventListener('playing', function(){ wrap.classList.add('ready'); });
    return player;
  }
  var SYNC_SLACK = 2;
  var videoWrap = document.getElementById('videoWrap'), playerReady = false;
  var player = makePlayer(videoWrap, function(){ playerReady = true; syncVideo(); });

  function syncVideo(){
    if(playerReady && player.getPlayerState) syncPlayer(player, mvOffset(), true);
    syncScreens();   // Multi-View: the other screens follow the same clock
  }
  // Keep one player on the stream clock, shifted by `offset` seconds (its camera); `on` = false pauses it
  function syncPlayer(p, offset, on){
    var ps = p.getPlayerState(), S = PlayerState;
    // mid-glide (10s skip) or mid fast-scrub: hold the picture still and seek once it settles
    if(skipAnim || fastTimer){ if(ps === S.PLAYING) p.pauseVideo(); return; }
    var want = state.pos + offset;
    var dur = p.getDuration() || 0, target = dur ? ((want % dur) + dur) % dur : Math.max(0, want);
    var diff = Math.abs(p.getCurrentTime() - target);
    if(dur) diff = Math.min(diff, dur - diff);   // the video loops, so 0:01 and the very end are close together
    if(on && diff > SYNC_SLACK && ps !== S.BUFFERING) p.seekTo(target, true);
    var play = on && state.playing;
    if(play && ps !== S.PLAYING && ps !== S.BUFFERING) p.playVideo();
    else if(!play && ps === S.PLAYING) p.pauseVideo();
  }
  // autoplay only works muted; the first key press or click turns the sound on
  function unmuteVideo(){ if(playerReady && player.isMuted && player.isMuted()) player.unMute(); }

  /* ---------------- Multi-View ---------------- */
  // Camera angles, picked into screens by priority on the cards (see mvActivate). The demo has one video, so each
  // camera is that video at its own offset (seconds) from the main stage; img = a frame captured from the video,
  // shown on its card, and on its screen until that screen's player starts.
  var ANGLES = [
    { name:'Main Stage', offset:0,   img:'concert-assets/moment-080.jpg' },
    { name:'Close-up',   offset:110, img:'concert-assets/moment-190.jpg' },
    { name:'Wide Cam',   offset:70,  img:'concert-assets/moment-150.jpg' },
    { name:'Dance Cam',  offset:40,  img:'concert-assets/moment-120.jpg' },
    { name:'Solo Cam',   offset:-70, img:'concert-assets/moment-010.jpg' },
    { name:'Center Cam', offset:-50, img:'concert-assets/moment-030.jpg' }
  ];
  // Screen rectangles on the 1920x1080 canvas for each layout (Figma "Screen Choice", node 1218:6867); screen 0 is
  // the main one (the one with sound). Every layout fills the whole canvas; screens that aren't 16:9 crop their
  // picture to fill (object-fit: cover).
  // 2 = two halves; 3 = a large screen (2/3 width) with two stacked on its right; 5 = two on top, three below;
  // 6 = 3 x 2; 6f = a large screen (2/3 x 2/3) with two stacked on its right and three along the bottom.
  var MV_GAP = 4;
  var LAYOUTS = {
    1: [[0,0,1920,1080]],
    2: [[0,0,960,1080],[960,0,960,1080]],
    3: [[0,0,1280,1080],[1280,0,640,540],[1280,540,640,540]],
    4: [[0,0,960,540],[960,0,960,540],[0,540,960,540],[960,540,960,540]],
    5: [[0,0,960,540],[960,0,960,540],[0,540,640,540],[640,540,640,540],[1280,540,640,540]],
    6: [[0,0,640,540],[640,0,640,540],[1280,0,640,540],[0,540,640,540],[640,540,640,540],[1280,540,640,540]],
    '6f': [[0,0,1280,720],[1280,0,640,360],[1280,360,640,360],[0,720,640,360],[640,720,640,360],[1280,720,640,360]]
  };
  // order = the picked videos in priority order: order[0] is on screen 1 (the one with sound), order[1] on screen 2…
  // rows: 0 = buttons + layouts, 1 = cards
  // It holds at most as many as the layout has screens, and never fewer than one.
  // layout = the chosen LAYOUTS key, n = its number of screens
  var mv = { open:false, layout:'1', n:1, order:[0], row:0, col:0, colByRow:[2, 0], shift:0 };
  var mvPanel = document.getElementById('mvPanel'), mvCards = document.getElementById('mvCards');
  var mvScreens = document.getElementById('mvScreens');
  var mvRows = [Array.prototype.slice.call(mvPanel.querySelectorAll('.mv-btns .icon-btn, .mv-opt')), []];
  ANGLES.forEach(function(a, i){
    var card = document.createElement('button');
    card.className = 'mv-card';
    card.setAttribute('data-mv', 'angle'); card.setAttribute('data-angle', i);
    card.setAttribute('aria-label', a.name);
    card.innerHTML = '<img alt=""><span class="mv-badge"></span>';
    card.firstChild.src = a.img;
    mvCards.appendChild(card);
    mvRows[1].push(card);
    var screen = document.createElement('div');
    screen.className = 'mv-screen';
    screen.innerHTML = '<img alt=""><div class="mv-video"></div><span>Pick a video below</span>';
    mvScreens.appendChild(screen);
  });
  // Screens 2-6 each get their own muted player of the same file, made the first time the screen shows a camera
  var screenPlayers = [];
  function screenPlayer(i){
    if(screenPlayers[i]) return screenPlayers[i];
    var wrap = mvScreens.children[i].querySelector('.mv-video'), sp = { ready:false, wrap:wrap };
    var video = document.createElement('video');
    video.src = videoWrap.querySelector('video').getAttribute('src');
    video.muted = true; video.loop = true; video.playsInline = true; video.preload = 'auto';
    wrap.appendChild(video);
    sp.player = makePlayer(wrap, function(){ sp.ready = true; syncScreens(); });
    screenPlayers[i] = sp;
    return sp;
  }
  function syncScreens(){
    Array.prototype.forEach.call(mvScreens.children, function(el, i){
      var a = i + 1 < mv.n ? mv.order[i + 1] : undefined;
      var sp = a !== undefined ? screenPlayer(i) : screenPlayers[i];
      if(sp && sp.ready) syncPlayer(sp.player, a !== undefined ? ANGLES[a].offset : 0, a !== undefined);
    });
  }
  // the layout icons are inlined so the focused one can turn dark
  mvPanel.querySelectorAll('.mv-opt > img').forEach(function(img){
    getText(img.getAttribute('src')).then(function(t){
      var svg = new DOMParser().parseFromString(t, 'image/svg+xml').documentElement;
      svg.removeAttribute('style'); svg.setAttribute('aria-hidden', 'true');
      img.replaceWith(document.importNode(svg, true));
    }).catch(function(){});
  });

  function mvOffset(){ return ANGLES[mv.order[0]].offset; }
  function layoutScreens(){
    var rects = LAYOUTS[mv.layout], g = mv.n > 1 ? MV_GAP/2 : 0;
    function place(el, r){
      el.style.left = (r[0] + g) + 'px'; el.style.top = (r[1] + g) + 'px';
      el.style.width = (r[2] - 2*g) + 'px'; el.style.height = (r[3] - 2*g) + 'px';
    }
    place(videoWrap, rects[0]);
    Array.prototype.forEach.call(mvScreens.children, function(el, i){
      var r = rects[i + 1];
      el.style.display = r ? 'block' : 'none';
      if(!r) return;
      place(el, r);
      var a = mv.order[i + 1];
      el.classList.toggle('empty', a === undefined);
      if(a !== undefined){
        el.style.display = 'block'; setSrc(el.firstChild, ANGLES[a].img);
      }
      else el.style.display = 'flex';
    });
    mvRows[1].forEach(function(card){
      var at = mv.order.indexOf(+card.getAttribute('data-angle'));
      card.classList.toggle('picked', at >= 0);
      card.querySelector('.mv-badge').textContent = at >= 0 ? at + 1 : '';
      card.setAttribute('aria-label', ANGLES[+card.getAttribute('data-angle')].name + (at >= 0 ? ', screen ' + (at + 1) : ', not on screen'));
    });
    canvas.classList.toggle('mv-active', mv.open || mv.n > 1);
  }
  function renderMv(){
    mvRows.forEach(function(items, r){
      items.forEach(function(el, c){ el.classList.toggle('focused', mv.open && r === mv.row && c === mv.col); });
    });
    mvPanel.querySelectorAll('.mv-opt').forEach(function(el){ el.classList.toggle('selected', el.getAttribute('data-layout') === mv.layout); });
    // keep the focused card inside the panel
    if(mv.open && mv.row === 1){
      var card = mvRows[1][mv.col], w = mvCards.parentNode.offsetWidth;
      var left = card.offsetLeft - mvCards.offsetLeft, right = left + card.offsetWidth;
      if(left - mv.shift < 0) mv.shift = left;
      else if(right - mv.shift > w) mv.shift = right - w;
      mv.shift = Math.max(0, Math.min(mv.shift, mvCards.scrollWidth - w));
      mvCards.style.transform = 'translateX(' + (-mv.shift) + 'px)';
    }
    layoutScreens();
  }
  function openMulti(){
    mv.open = true;
    mv.row = 0; mv.col = mvRows[0].indexOf(mvPanel.querySelector('.mv-opt.selected, .mv-opt'));   // start on the current layout
    canvas.classList.add('mv-open');
    renderMv();
  }
  function closeMulti(){
    mv.open = false;
    canvas.classList.remove('mv-open');
    state.row = 0; state.col = rows[0].indexOf(document.querySelector('[data-action="multiView"]'));
    render(); renderMv();
  }
  function mvActivate(){
    var el = mvRows[mv.row][mv.col], what = el.getAttribute('data-mv');
    if(what === 'close'){ closeMulti(); return; }
    if(what === 'layout'){
      // fewer screens: the lowest priorities drop off; more screens: the new ones wait for a pick
      mv.layout = el.getAttribute('data-layout');
      mv.n = LAYOUTS[mv.layout].length;
      mv.order = mv.order.slice(0, mv.n);
      renderMv(); syncVideo(); return;
    }
    if(what === 'angle'){
      var a = +el.getAttribute('data-angle'), at = mv.order.indexOf(a);
      if(mv.n === 1) mv.order = [a];                    // one screen: it simply goes there
      else if(at >= 0){
        // numbered: take its number away and move the ones after it up (screen 1 always keeps a video)
        if(mv.order.length > 1) mv.order.splice(at, 1);
      }
      else if(mv.order.length < mv.n) mv.order.push(a); // next free number
      else mv.order[mv.n - 1] = a;                      // all screens full: it takes the last number
      renderMv(); syncVideo();
    }
  }
  function mvKey(e){
    if(e.key === 'Escape' || e.key === 'Backspace'){ closeMulti(); return true; }
    if(e.repeat && e.key === 'Enter') return true;
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      mv.col = Math.max(0, Math.min(mvRows[mv.row].length - 1, mv.col + (e.key === 'ArrowRight' ? 1 : -1)));
    } else if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      var r = e.key === 'ArrowDown' ? 1 : 0;
      if(r === mv.row) return true;
      mv.colByRow[mv.row] = mv.col; mv.row = r; mv.col = Math.min(mv.colByRow[r], mvRows[r].length - 1);
    } else if(e.key === 'Enter' || e.key === ' '){ mvActivate(); return true; }
    else return false;
    renderMv();
    return true;
  }
  mvRows.forEach(function(items, r){
    items.forEach(function(el){
      el.addEventListener('mouseenter', function(){ mv.row = r; mv.col = items.indexOf(el); renderMv(); });
      el.addEventListener('click', function(){ mv.row = r; mv.col = items.indexOf(el); mvActivate(); });
    });
  });

  /* ---------------- remote / keyboard ---------------- */
  var WAKE_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '];
  window.addEventListener('keydown', function(e){
    unmuteVideo();
    // the Multi-View panel has its own focus; it doesn't auto-hide while open
    if(mv.open){ wake(); if(mvKey(e)) e.preventDefault(); return; }
    if(e.key==='Escape' || e.key==='Backspace'){
      e.preventDefault();
      // Back first hides the overlay; with the overlay already hidden it goes back to the Content Picker
      if(!isHidden()){ hideNow(); return; }
      goBackToPicker(); return;
    }
    // while the UI is hidden, a direction key or Enter only wakes it (so nothing changes unseen)
    if(WAKE_KEYS.indexOf(e.key) !== -1){
      var wasHidden = isHidden();
      wake();
      if(wasHidden){ e.preventDefault(); return; }
    }
    // <- / -> on the seek bar: hold = fast rewind/forward; tap = 10s jump. Tap vs hold is decided in seekKeyDown/seekKeyUp; auto-repeat events are ignored.
    if(state.row === 1 && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
      e.preventDefault();
      if(!e.repeat) seekKeyDown(e.key==='ArrowRight' ? 1 : -1);
      return;
    }
    if(e.repeat && e.key==='Enter') return;
    var handled = true;
    if(e.key==='ArrowUp') move(-1, 0);
    else if(e.key==='ArrowDown') move(1, 0);
    else if(e.key==='ArrowLeft') move(0, -1);
    else if(e.key==='ArrowRight') move(0, 1);
    else if(e.key==='Enter' || e.key===' ') activate();
    else handled = false;
    if(handled) e.preventDefault();
  });

  /* ---------------- mouse / touch ---------------- */
  function bindPointer(el, r){
    function focusIt(){ var c = rows[r].indexOf(el); if(c < 0) return false; state.row = r; state.col = c; render(); return true; }
    el.addEventListener('mouseenter', focusIt);
    if(r !== 1) el.addEventListener('click', function(){ if(focusIt()) activate(); });
  }
  [allRow0, rows[1], allRow2].forEach(function(items, r){
    items.forEach(function(el){ bindPointer(el, r); });
  });
  // clicking the handle plays/pauses; clicking anywhere else on the track seeks there
  document.getElementById('track').addEventListener('click', function(e){
    state.row = 1; state.col = 0;
    if(handleEl.contains(e.target)){ togglePlay(); return; }
    var rect = this.getBoundingClientRect(), f = (e.clientX - rect.left) / rect.width;
    seekTo(f >= 0.995 ? state.live : f * state.live);   // the far right end always means live
    render();
  });

  /* ---------------- layout scaling (same approach as the other prototypes) ---------------- */
  var DESIGN_W = 1920, DESIGN_H = 1080;
  var frame = document.getElementById('tv-frame');
  var canvas = document.getElementById('canvas');
  // Desktop (default): header and controls are drawn at 0.625 of the Figma TV sizes in real screen pixels
  // (24px text -> 15px, 84px buttons -> ~52px), whatever the window size. ?mode=tv keeps the exact Figma sizes.
  var TV_MODE = /[?&]mode=tv\b/.test(location.search);
  var DESKTOP_UI = 0.625;
  function layout(){
    var scale = Math.min(window.innerWidth/DESIGN_W, window.innerHeight/DESIGN_H);
    frame.style.width = (DESIGN_W*scale)+'px';
    frame.style.height = (DESIGN_H*scale)+'px';
    canvas.style.transform = 'scale('+scale+')';
    var ui = TV_MODE ? 1 : Math.min(1, DESKTOP_UI/scale);
    canvas.style.setProperty('--ui', ui);
  }
  window.addEventListener('resize', layout);
  layout();

  /* ---------------- auto-hide ("wake") ---------------- */
  // Shown on arrival, hidden after 3s without input; direction keys / Enter (and mouse movement) wake it again.
  var HIDE_AFTER = 3000, hideTimer;
  function isHidden(){ return canvas.classList.contains('ui-hidden'); }
  function wake(){
    canvas.classList.remove('ui-hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideIfIdle, HIDE_AFTER);
  }
  function hideNow(){
    clearTimeout(hideTimer);
    canvas.classList.add('ui-hidden');
  }
  // the Multi-View panel stays up while open; the countdown starts over once it closes
  function hideIfIdle(){
    if(canvas.classList.contains('mv-open')){ hideTimer = setTimeout(hideIfIdle, HIDE_AFTER); return; }
    canvas.classList.add('ui-hidden');
  }
  frame.addEventListener('mousemove', wake);
  frame.addEventListener('click', wake);
  frame.addEventListener('click', unmuteVideo);

  render();
  wake();
})();
</script>
</body>
</html>
