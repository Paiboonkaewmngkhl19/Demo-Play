<!DOCTYPE html>
<!--
  Content Picker — TV-style page where the viewer selects what to open.
  Same design language as key-moment-navigator.html (Aurora palette, 1920x1080 canvas scaled to the window,
  focus ring + scale on the focused item). Works with mouse/touch and with a TV remote (arrow keys + Enter).
  Options: Key Moments (Key Moment Navigator), Multi-View (Multiview), Clips Reels (the Vertical Discovery Feed app at the
  project root), Home (home.html at the project root, the Stream Home prototype), Live Stream (live-stream.html, the
  live-channel player from Figma) and Concert (concert-live.html, the same player set up for a live concert).
  Each destination has a Back control that returns here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#050b1a;
    --bg-1:#0a1628;
    --bg-2:#122241;
    --ink:#e8f4f8;
    --ink-dim:#b9cbd4;
    --ink-faint:rgba(232,244,248,0.55);
    --chip-bg:rgba(232,244,248,0.07);
    --chip-border:rgba(232,244,248,0.16);
    --focus-ring:#00ff87;
    --aurora-green:#00ff87;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #tv-frame{
    position:relative;
    background:#000;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
  }
  #canvas{
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
    transform-origin:top left;
    background:
      radial-gradient(60% 45% at 15% 0%, rgba(0,255,135,.14), transparent 65%),
      radial-gradient(55% 40% at 85% 0%, rgba(0,212,255,.12), transparent 65%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 70%);
  }

  /* ---------- Header ---------- */
  header{ position:absolute; left:96px; right:96px; top:96px; text-align:center; }
  h1{ margin:0; font-size:60px; font-weight:800; letter-spacing:-.01em; line-height:1.1; }
  .sub{ margin:14px 0 0; font-size:22px; font-weight:500; color:var(--ink-dim); }

  /* ---------- Category grid ---------- */
  #grid{
    position:absolute; left:96px; top:280px;
    width:1728px;
    /* one centred row of 2:3 cards, 400 x 600 (--cols = number of cards, set by JS) */
    display:grid; grid-template-columns:repeat(var(--cols, 4), 400px); justify-content:center;
    grid-auto-rows:600px; gap:48px;
  }
  .card{
    --accent:#00ff87;
    position:relative;
    display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
    padding:40px 44px;
    text-align:left; font:inherit; color:inherit;
    background:var(--chip-bg);
    border:2px solid var(--chip-border);
    border-radius:24px;
    cursor:pointer;
    outline:none;
    overflow:visible;   /* the focus ring sits outside the card; the poster clips itself */
    -webkit-tap-highlight-color:transparent;
    transform-origin:center center;   /* focus grows the card equally in every direction */
    transition:transform .22s cubic-bezier(.2,0,0,1), box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }
  .card::before{ /* accent wash behind the icon */
    content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(280px 220px at 18% 8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    pointer-events:none;
  }
  .card .ic{
    position:absolute; left:44px; top:40px;
    width:88px; height:88px; border-radius:24px;
    display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    color:var(--accent);
  }
  .card .ic svg{ width:44px; height:44px; }
  .card b{ position:relative; font-size:40px; font-weight:700; line-height:1.15; }
  .card span.desc{ position:relative; font-size:20px; line-height:1.4; font-weight:500; color:var(--ink-faint); }
  /* poster card: the image fills the top of the card from edge to edge and fades into the card's dark fill */
  /* 380px of a 400px-wide 4:5 poster: down to just above the price panel at its bottom, which stays cut off */
  /* the fade is on the box, not the image, so a zoomed image (imageZoom) fades out the same way */
  .card .poster{
    position:absolute; left:0; right:0; top:0; height:380px; pointer-events:none; overflow:hidden; border-radius:22px 22px 0 0;
    -webkit-mask-image:linear-gradient(to bottom, #000 50%, transparent 100%);
    mask-image:linear-gradient(to bottom, #000 50%, transparent 100%);
  }
  .card .poster img{ width:100%; height:100%; object-fit:cover; object-position:top; display:block; transform-origin:top center; }
  .card.has-poster::before{ display:none; }
  /* ---------- Focus ----------
     The focused card grows ~9% around its centre. Around it floats ONE shared "glass" ring for the whole
     page (#focusRing, placed by placeRing()): it glides from card to card instead of each card drawing its own, so
     it never blinks. No gap (it hugs the card), 8px thick, corners concentric with the card; filled with a blurred, brightened, more
     saturated copy of the focused card's artwork (two stacked layers that crossfade when focus moves), cut to a
     ring by padding + mask-composite: exclude; a 1px white highlight on its outer edge and a soft outer glow. The
     ring moves with translate + width/height in the same 220ms ease-out as the card's scale. */
  .focused{ transform:scale(1.09); z-index:5; }
  .focus-ring{
    --gap:0px; --w:8px; --ease:cubic-bezier(.2,0,0,1);
    position:absolute; left:0; top:0; z-index:6; pointer-events:none; opacity:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 0 15px rgba(255,255,255,.15);
    transition:transform .22s var(--ease), width .22s var(--ease), height .22s var(--ease), border-radius .22s var(--ease), opacity .2s ease;
    will-change:transform, width, height;
  }
  .focus-ring.on{ opacity:1; }
  /* placed without sliding (first focus, resize, reduced motion): only the fade-in runs */
  .focus-ring.instant{ transition:opacity .2s ease; }
  .focus-glass{
    position:absolute; inset:0; border-radius:inherit; padding:var(--w); overflow:hidden;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .focus-glass i{
    position:absolute; inset:0; opacity:0;
    background:
      linear-gradient(to bottom, transparent 40%, #161c2c 72%),
      var(--img, none) top center / 100% auto no-repeat,
      #161c2c;
    filter:blur(5px) brightness(1.6) saturate(1.3);
    transition:opacity .22s cubic-bezier(.2,0,0,1);
  }
  .focus-ring.instant .focus-glass i{ transition:none; }
  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
    .focus-ring, .focus-glass i{ transition:none; }
  }

  /* ---------- Footer ---------- */
  footer{
    position:absolute; left:152px; right:152px; bottom:84px;
    display:flex; align-items:center; justify-content:center;
  }
  .hints{ display:flex; align-items:center; gap:40px; font-size:18px; font-weight:500; color:var(--ink-faint); }
  .hints span{ display:inline-flex; align-items:center; }
  /* every key chip shares one height so the row lines up */
  .hints kbd{
    font:inherit; font-weight:700; color:var(--ink);
    display:inline-flex; align-items:center; justify-content:center;
    height:40px; box-sizing:border-box;
    padding:0 12px; margin-right:10px; border-radius:8px;
    background:var(--chip-bg); border:1px solid var(--chip-border);
  }
  /* the direction arrows are drawn larger so they read clearly on a TV, inside the same chip height */
  .hints kbd.arrows{ font-size:26px; line-height:1; padding-bottom:3px; }

  /* ---------- Responsive: upright tablets and phones (body.fluid, set by layout()) ----------
     TV, desktop and landscape tablets keep the scaled 1920x1080 screen above. On a screen taller than wide or
     narrower than 900px the page flows instead: 2 x 2 cards on a tablet, one column on a phone, scrolling. */
  body.fluid{ display:block; overflow-y:auto; height:auto; min-height:100%;
    background:linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 60%); }
  body.fluid #tv-frame{ width:auto !important; height:auto !important; background:none; box-shadow:none; overflow:visible; }
  body.fluid #canvas{ position:static; width:auto; height:auto; transform:none !important; background:none;
    padding:max(48px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom)); }
  body.fluid header, body.fluid #grid, body.fluid footer{ position:static; }
  body.fluid h1{ font-size:clamp(30px, 6vw, 48px); }
  body.fluid .sub{ font-size:clamp(14px, 2.4vw, 18px); margin-top:10px; }
  body.fluid #grid{ width:auto; max-width:760px; margin:32px auto 0; grid-template-columns:repeat(2, 1fr); grid-auto-rows:auto; gap:24px; }
  body.fluid .card{ aspect-ratio:2/3; padding:20px 22px; border-radius:20px; }
  body.fluid .card .poster{ height:63% !important; border-radius:18px 18px 0 0; }   /* beats the per-card desktop height */
  body.fluid .card b{ font-size:clamp(20px, 3.4vw, 28px); }
  body.fluid .card span.desc{ font-size:clamp(13px, 2vw, 16px); }
  body.fluid .focused{ transform:scale(1.05); }
  body.fluid #grid{ position:relative; }   /* the ring is placed inside the grid, so it scrolls with the cards */
  body.fluid .focus-ring{ --gap:0px; --w:5px; }
  body.fluid footer{ margin-top:36px; }
  body.fluid .hints{ gap:20px; font-size:14px; flex-wrap:wrap; justify-content:center; }
  body.fluid .hints kbd{ height:32px; }
  /* phones: still 2 x 2, with tighter spacing and smaller text so the cards fit side by side */
  @media (max-width: 560px){
    body.fluid #canvas{ padding-left:16px; padding-right:16px; }
    body.fluid #grid{ gap:12px; margin-top:24px; }
    body.fluid .card{ padding:12px 12px 14px; border-radius:16px; gap:2px; }
    body.fluid .card .poster{ height:60% !important; border-radius:14px 14px 0 0; }
    body.fluid .card b{ font-size:17px; }
    body.fluid .card span.desc{ font-size:12px; line-height:1.35; }
  }
  /* touch-only screens have no keyboard: hide the key hints, and no card is "focused" (you just tap one); a card
     that a keyboard reaches still gets the ring */
  @media (hover: none) and (pointer: coarse){
    body.fluid footer{ display:none; }
    body.fluid .card:focus:not(.focused){ outline:none; }   /* the ring comes from .focused only (keyboard use) */
    body.fluid .card:active{ transform:scale(.98); }
  }
</style>
</head>
<body>

<div id="tv-frame">
  <div id="canvas">
    <header>
      <h1>Choose a Demo</h1>
      <p class="sub">Pick a demo to try, then press Enter or click to open it</p>
    </header>

    <div id="grid" role="group" aria-label="Content options"></div>

    <footer>
      <div class="hints">
        <span><kbd class="arrows">←↑↓→</kbd>Move</span>
        <span><kbd>Enter</kbd>Open</span>
        <span><kbd>Esc</kbd>Back &amp; Close</span>
      </div>
    </footer>
  </div>
</div>

<script>
(function(){
  /* ---------------- data ---------------- */
  // Every option opens an existing prototype (`href`, relative to this file). hidden: true leaves it off the picker.
  // image: a poster shown across the top of the card in place of the icon tile; imageHeight (px) shortens it so
  // the fade ends above anything at the poster's bottom (default 380); imageZoom enlarges it from the top centre,
  // for a poster too short to fill the space (imageOrigin moves the point it grows from).
  var CATEGORIES = [
    { id:'sports',   hidden:true, name:'Key Moments', desc:'Jump straight to goals, cards and highlights', accent:'#00E676', icon:'ball',  href:'key-moment-navigator.html' },
    { id:'concert',  hidden:true, name:'Multi-View',  desc:'Watch several camera angles side by side', accent:'#E040FB', icon:'music', href:'multiview-prototype.html' },
    { id:'home',     image:'picker-assets/home-poster.jpg', imageHeight:320, name:'Home',        desc:'Smart TV–style home with content rails', accent:'#00E5FF', icon:'home',  href:'../home.html' },
    { id:'live',     image:'picker-assets/key-moment-poster.jpg', name:'Key Moment',  desc:'Jump straight to goals, kick-offs and highlights', accent:'#FF4D6D', icon:'live',  href:'live-stream.html' },
    { id:'concert-live', image:'picker-assets/multi-view-poster.jpg', name:'Multi-View', desc:'Watch several camera angles side by side', accent:'#B388FF', icon:'mic', href:'concert-live.html' },
    { id:'vertical', image:'picker-assets/clips-reels-poster.jpg', imageZoom:1.4, name:'Clips/Reels', desc:'Swipe through short vertical clips', accent:'#FF6D00', icon:'phone', href:'../?from=picker' }
  ];
  CATEGORIES = CATEGORIES.filter(function(c){ return !c.hidden; });
  var COLS = CATEGORIES.length;
  var TOUCH_ONLY = window.matchMedia('(hover: none) and (pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && !window.matchMedia('(hover: hover)').matches);
  // Focus ring: shown from the start on TV / desktop; on a touch screen only once a key is pressed (a keyboard or
  // remote is in use), and hidden again on the next touch
  var showFocus = !TOUCH_ONLY;

  var ICONS = {
    ball:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4z"/><path d="M12 3v5M20.5 9.5L15.5 10.5M17.5 19l-3.3-4.5M6.5 19l3.3-4.5M3.5 9.5l5 1"/></svg>',
    music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
    home:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg>',
    mic:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21.5M8.5 21.5h7"/></svg>',
    live:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>'
  };

  /* ---------------- state ---------------- */
  // Picking an option opens it straight away. Focus always starts on the first card, also when coming back
  // from a demo.
  var state = { focus:0 };


  /* ---------------- render ---------------- */
  var grid = document.getElementById('grid');
  grid.style.setProperty('--cols', COLS);
  var cards = [];

  CATEGORIES.forEach(function(c, i){
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'card';
    el.style.setProperty('--accent', c.accent);
    if(c.image){ el.classList.add('has-poster'); el.style.setProperty('--ring-img', 'url("'+c.image+'")'); }
    el.innerHTML =
      (c.image ? '<span class="poster"'+(c.imageHeight ? ' style="height:'+c.imageHeight+'px"' : '')+'><img src="'+c.image+'" alt=""'+(c.imageZoom ? ' style="transform:scale('+c.imageZoom+')'+(c.imageOrigin ? ';transform-origin:'+c.imageOrigin : '')+'"' : '')+'></span>' : '<span class="ic">'+ICONS[c.icon]+'</span>')+
      '<b>'+c.name+'</b><span class="desc">'+c.desc+'</span>';
    el.addEventListener('click', function(){ state.focus=i; render(); open(i); });
    el.addEventListener('mouseenter', function(){ if(state.focus!==i){ state.focus=i; render(); } });
    grid.appendChild(el);
    cards.push(el);
  });

  /* ---------------- shared sliding focus ring ---------------- */
  var ring = document.createElement('div');
  ring.className = 'focus-ring instant';
  ring.id = 'focusRing';
  ring.setAttribute('aria-hidden', 'true');
  ring.innerHTML = '<div class="focus-glass"><i></i><i></i></div>';
  grid.appendChild(ring);
  var layers = ring.querySelectorAll('.focus-glass i'), front = 0, ringImg = null, ringShown = false;
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Place the ring around the focused card's FINAL rect: worked out from its layout box (offset*, which ignore
  // transforms) and the focus scale, not measured mid-animation. Changing the values mid-glide simply retargets the
  // CSS transition from where the ring is now, so fast key presses never queue or jump.
  function placeRing(instant){
    if(!showFocus){ ring.classList.remove('on'); ringShown = false; return; }
    var card = cards[state.focus], rs = getComputedStyle(ring);
    var o = parseFloat(rs.getPropertyValue('--gap')) + parseFloat(rs.getPropertyValue('--w'));
    var sc = document.body.classList.contains('fluid') ? 1.05 : 1.09;
    var cw = card.offsetWidth, ch = card.offsetHeight, fw = cw * sc, fh = ch * sc;
    var fx = card.offsetLeft - (fw - cw) / 2, fy = card.offsetTop - (fh - ch) / 2;   // grows around its centre
    var slide = !instant && ringShown && !REDUCED;
    if(!slide) ring.classList.add('instant');
    ring.style.width = (fw + 2*o) + 'px';
    ring.style.height = (fh + 2*o) + 'px';
    ring.style.transform = 'translate(' + (fx - o) + 'px,' + (fy - o) + 'px)';
    ring.style.borderRadius = (parseFloat(getComputedStyle(card).borderTopLeftRadius) * sc + o) + 'px';
    // artwork: crossfade to the new card's image on the back layer, unless placing without a slide
    var img = card.style.getPropertyValue('--ring-img');
    if(img !== ringImg){
      if(slide) front = 1 - front;
      layers[front].style.setProperty('--img', img || 'none');
      layers[front].style.opacity = 1;
      layers[1 - front].style.opacity = 0;
      ringImg = img;
    }
    if(!ringShown){ ring.classList.add('on'); ringShown = true; }
    if(!slide){ void ring.offsetWidth; requestAnimationFrame(function(){ ring.classList.remove('instant'); }); }
  }
  window.addEventListener('resize', function(){ placeRing(true); });

  function render(){
    cards.forEach(function(el, i){
      el.classList.toggle('focused', showFocus && state.focus===i);
      el.tabIndex = state.focus===i ? 0 : -1;
    });
    // keep real DOM focus in step with the visual focus (screen readers, Tab); not on a touch screen, where focusing
    // a card would draw the browser's own focus ring on it
    if(showFocus && document.activeElement !== cards[state.focus]) cards[state.focus].focus({preventScroll:true});
    if(!showFocus && document.activeElement && document.activeElement.classList.contains('card')) document.activeElement.blur();
    if(document.body.classList.contains('fluid') && !TOUCH_ONLY) cards[state.focus].scrollIntoView({block:'nearest', behavior:'smooth'});
    placeRing();
  }

  function open(i){
    var c = CATEGORIES[i];
    window.location.href = c.href;
  }

  /* ---------------- remote / keyboard ---------------- */
  window.addEventListener('touchstart', function(){ if(showFocus && TOUCH_ONLY){ showFocus = false; render(); } }, { passive:true });
  window.addEventListener('keydown', function(e){
    if(!showFocus){ showFocus = true; render(); if(/^Arrow/.test(e.key)){ e.preventDefault(); return; } }   // first key just shows the ring
    var n = CATEGORIES.length, handled = true;
    if(e.key==='ArrowRight'){ if(state.focus < n-1) state.focus++; }
    else if(e.key==='ArrowLeft'){ if(state.focus > 0) state.focus--; }
    else if(e.key==='ArrowDown'){ if(state.focus+COLS < n) state.focus += COLS; }
    else if(e.key==='ArrowUp'){ if(state.focus-COLS >= 0) state.focus -= COLS; }
    else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(state.focus); return; }
    else handled = false;
    if(handled){ e.preventDefault(); render(); }
  });

  /* ---------------- layout scaling (same approach as the other prototypes) ---------------- */
  var DESIGN_W = 1920, DESIGN_H = 1080;
  var frame = document.getElementById('tv-frame');
  var canvas = document.getElementById('canvas');
  function layout(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var fluid = vh > vw || vw < 900;
    document.body.classList.toggle('fluid', fluid);
    // the arrow keys move through however many columns the grid shows now
    COLS = fluid ? getComputedStyle(grid).gridTemplateColumns.split(' ').length : CATEGORIES.length;
    if(fluid){ frame.style.width = frame.style.height = canvas.style.transform = ''; return; }
    var scale = Math.min(vw/DESIGN_W, vh/DESIGN_H);
    frame.style.width = (DESIGN_W*scale)+'px';
    frame.style.height = (DESIGN_H*scale)+'px';
    canvas.style.transform = 'scale('+scale+')';
  }
  window.addEventListener('resize', layout);
  layout();

  render();
  // coming back with the browser's Back can restore this page as it was left; start on the first card again
  window.addEventListener('pageshow', function(e){ if(e.persisted){ state.focus = 0; render(); } });
})();
</script>
</body>
</html>
