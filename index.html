
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Vertical Discovery Feed Prototype</title>
      <meta name="description" content="Offers a personalized vertical feed of immersive short-form previews across diverse genres, enabling users to effortlessly discover and instantly watch premium content." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // The TV Content Picker is the entry point for every demo: opening the site root goes there, unless the
        // picker's "Clips Reels" card sent us here (?from=picker). Same rule as the dev server's redirect.
        if (new URLSearchParams(location.search).get('from') !== 'picker') {
          location.replace('tv-features-test/content-picker.html');
        }
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
